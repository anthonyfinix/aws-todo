name: Deployment Workflow
on: 
  push:
    branches: [ cicd, main ] # Runs on your feature branch too
  workflow_dispatch: # Allows you to trigger it manually from the UI
    inputs:
      action:
        description: 'Choose action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy

permissions:
  id-token: write # This is REQUIRED for OIDC to request the JWT
  contents: read  # This is required to checkout the code

env:
  STACK_NAME: practice-todo-app
  AWS_REGION: us-east-1

jobs:
  DeployApp:
    if: github.event.inputs.action != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::192347447415:role/GitHubActions-SAM-Deployer-Role
          aws-region: ${{ env.AWS_REGION }}
      
      - name: SAM Deploy
        run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --region ${{ env.AWS_REGION }}
      
      - name: Get Stack Outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='UiBucketName'].OutputValue" --output text)
          
          # Store these in GITHUB_ENV so following steps can use them
          echo "VITE_API_URL=$API_URL" >> $GITHUB_ENV
          echo "UI_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install and Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          # Vite will see VITE_API_URL from the environment and bake it into the dist
          npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
      
      - name: Sync to S3
        run: |
          aws s3 sync ./frontend/dist s3://${{ env.UI_BUCKET_NAME }} --delete
          
  Cleanup:
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    env:
      STACK_NAME: practice-todo-app
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::192347447415:role/GitHubActions-SAM-Deployer-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Empty S3 Bucket
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='UiBucketName'].OutputValue" --output text)
          if [ "$BUCKET_NAME" != "None" ]; then
            aws s3 rm s3://$BUCKET_NAME --recursive
          fi

      - name: Delete Stack
        run: sam delete --stack-name ${{ env.STACK_NAME }} --no-prompts --region us-east-1