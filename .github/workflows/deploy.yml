name: Deployment Workflow
on: 
  push:
    branches: [ cicd, main ] # Runs on your feature branch too
  workflow_dispatch: # Allows you to trigger it manually from the UI

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check SAM version
        run: sam --version

      - name: List files
        run: ls -R